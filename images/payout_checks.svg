<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="690" viewBox="0 0 1140 690" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Payout checks: did each bank pay what it should?</title><desc>Diagram of fct_payout_checks: expected sales and reported payouts joined with a full outer join, then each row labelled matched or with its problem, with the counts for 2025.</desc><style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2937; }
.h1 { font-size: 24px; font-weight: 700; }
.sub { font-size: 14px; fill: #6B7280; }
.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
.grain { font-size: 13px; font-weight: 600; }
.meta { font-size: 12px; fill: #6B7280; }
.col { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
.note { font-size: 11.5px; fill: #6B7280; }
.badge { font-size: 11px; font-weight: 600; }
.lbl { font-size: 12px; fill: #6B7280; }
.lblb { font-size: 12px; font-weight: 600; fill: #374151; }
.body { font-size: 13px; fill: #374151; }
.bodyb { font-size: 13px; font-weight: 600; }
.big { font-size: 22px; font-weight: 700; }
.sec { font-size: 11px; font-weight: 700; fill: #6B7280; letter-spacing: 0.06em; }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect width="1140" height="690" fill="#F8FAFC"/><text class="h1" x="40" y="52">Payout checks: did each bank pay what it should?</text><text class="sub" x="40" y="78">Banks keep their fee before paying the platform, so a wrong fee or a missing payout is easy to miss.</text><rect x="30" y="112" width="300" height="147" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="30" y="122" width="4" height="127" rx="2" fill="#2563EB"/><text class="bodyb" x="46" y="140">Expected</text><text class="body" x="46" y="165">Approved sales summed per shop, bank and</text><text class="body" x="46" y="184">day: count, gross € and the fee set by</text><text class="body" x="46" y="203">the fee rules.</text><text class="col" x="46" y="222">int_approved_payments</text><text class="meta" x="46" y="241">11,285 shop × bank × day rows</text><rect x="30" y="283" width="300" height="147" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="30" y="293" width="4" height="127" rx="2" fill="#EA580C"/><text class="bodyb" x="46" y="311">Reported</text><text class="body" x="46" y="336">What each bank actually paid the</text><text class="body" x="46" y="355">platform: count, gross € and the fee it</text><text class="body" x="46" y="374">kept.</text><text class="col" x="46" y="393">stg_bank_payouts</text><text class="meta" x="46" y="412">11,281 payouts</text><rect x="400" y="182" width="260" height="155" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="name" x="416" y="210">FULL OUTER JOIN</text><text class="body" x="416" y="235">on shop_id + bank_id +</text><text class="body" x="416" y="254">payment_date</text><text class="body" x="416" y="281">Keeps rows that have no partner on</text><text class="body" x="416" y="300">the other side, so a payout that</text><text class="body" x="416" y="319">never arrived still shows up.</text><path d="M330,185.5 L400,222" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M330,356.5 L400,297" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><text class="sec" x="730" y="116">EVERY ROW GETS ONE RESULT (FIRST THAT FITS)</text><rect x="730" y="130" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="730" y="138" width="4" height="40" rx="2" fill="#DC2626"/><text class="col" x="746" y="154" font-weight="700">missing_payout</text><text class="meta" x="746" y="173">payments, but no payout</text><text class="big" x="1094" y="166" text-anchor="end" style="fill:#DC2626">4</text><text class="lbl" x="920.0" y="204" text-anchor="middle">else ↓</text><rect x="730" y="214" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="730" y="222" width="4" height="40" rx="2" fill="#6B7280"/><text class="col" x="746" y="238" font-weight="700">payout_without_payments</text><text class="meta" x="746" y="257">a payout, but no payments</text><text class="big" x="1094" y="250" text-anchor="end" style="fill:#6B7280">0</text><text class="lbl" x="920.0" y="288" text-anchor="middle">else ↓</text><rect x="730" y="298" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="730" y="306" width="4" height="40" rx="2" fill="#6B7280"/><text class="col" x="746" y="322" font-weight="700">count_or_amount_mismatch</text><text class="meta" x="746" y="341">count or gross € differs</text><text class="big" x="1094" y="334" text-anchor="end" style="fill:#6B7280">0</text><text class="lbl" x="920.0" y="372" text-anchor="middle">else ↓</text><rect x="730" y="382" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="730" y="390" width="4" height="40" rx="2" fill="#DC2626"/><text class="col" x="746" y="406" font-weight="700">wrong_fee</text><text class="meta" x="746" y="425">fee off by more than 1 cent per payment</text><text class="big" x="1094" y="418" text-anchor="end" style="fill:#DC2626">96</text><text class="lbl" x="920.0" y="456" text-anchor="middle">else ↓</text><rect x="730" y="466" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="730" y="474" width="4" height="40" rx="2" fill="#16A34A"/><text class="col" x="746" y="490" font-weight="700">matched</text><text class="meta" x="746" y="509">none of the above</text><text class="big" x="1094" y="502" text-anchor="end" style="fill:#16A34A">11,185</text><path d="M660,259.5 L730,259.5" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect x="30" y="560" width="1080" height="90" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="30" y="570" width="4" height="70" rx="2" fill="#DC2626"/><text class="bodyb" x="46" y="588">Result: €17,357 to claim back from the banks</text><text class="body" x="46" y="613">4 payouts never arrived: €17,267 the platform never received (71 sales). 96 payouts from Bank NL kept €89.79 too much in fees. A fee may differ by up</text><text class="body" x="46" y="632">to 1 cent per payment, because each payment&#x27;s fee is rounded on its own.</text></svg>