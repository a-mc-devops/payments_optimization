<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Money flow of one €50 card payment</title>
<desc>The customer pays €50, the collecting bank keeps a €0.40 fee and pays the shop €49.60, the shop pays the platform €0.65, and the platform refunds unchecked fraud. Each step is linked to the raw table that records it; the money map combines them.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.leader { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 4 3; }
.legend { fill: #5F5E5A; }
</style>
</defs>
<rect x="0" y="0" width="680" height="740" fill="#FFFFFF"/>
<g class="gray"><rect x="40" y="40" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="63" text-anchor="middle">Customer</text><text class="ts" x="190" y="83" text-anchor="middle">pays €50 by card</text></g>
<g class="gray"><rect x="40" y="136" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="159" text-anchor="middle">Customer's bank and card network</text><text class="ts" x="190" y="179" text-anchor="middle">pass the €50 on</text></g>
<g class="gray"><rect x="40" y="232" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="255" text-anchor="middle">Collecting bank (NL, DE, FR)</text><text class="ts" x="190" y="275" text-anchor="middle">keeps its fee: €0.40</text></g>
<g class="gray"><rect x="40" y="328" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="351" text-anchor="middle">Shop</text><text class="ts" x="190" y="371" text-anchor="middle">gets €49.60, next working day</text></g>
<g class="gray"><rect x="40" y="424" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="447" text-anchor="middle">Platform</text><text class="ts" x="190" y="467" text-anchor="middle">shop pays it €0.65 (1.05 − 0.40)</text></g>
<g class="gray"><rect x="40" y="520" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="543" text-anchor="middle">Fraud refund to shop</text><text class="ts" x="190" y="563" text-anchor="middle">unchecked fraud: amount + €20</text></g>
<line class="arr" x1="190" y1="96" x2="190" y2="134" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="192" x2="190" y2="230" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="288" x2="190" y2="326" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="384" x2="190" y2="422" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="480" x2="190" y2="518" marker-end="url(#arrow)"/>
<g class="teal"><rect x="400" y="40" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="63" text-anchor="middle">payment_attempts</text><text class="ts" x="520" y="83" text-anchor="middle">every try, approved or not</text></g>
<rect x="400" y="136" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts legend" x="520" y="169" text-anchor="middle">not in the data</text>
<g class="teal"><rect x="400" y="232" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="255" text-anchor="middle">fee_rules</text><text class="ts" x="520" y="275" text-anchor="middle">what each bank charges</text></g>
<g class="teal"><rect x="400" y="328" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="351" text-anchor="middle">bank_payouts</text><text class="ts" x="520" y="371" text-anchor="middle">per shop, bank and day</text></g>
<g class="teal"><rect x="400" y="424" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="447" text-anchor="middle">shops</text><text class="ts" x="520" y="467" text-anchor="middle">the platform's price</text></g>
<g class="teal"><rect x="400" y="520" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="543" text-anchor="middle">fraud_reports</text><text class="ts" x="520" y="563" text-anchor="middle">reports arrive weeks later</text></g>
<line class="leader" x1="340" y1="68" x2="400" y2="68"/>
<line class="leader" x1="340" y1="164" x2="400" y2="164"/>
<line class="leader" x1="340" y1="260" x2="400" y2="260"/>
<line class="leader" x1="340" y1="356" x2="400" y2="356"/>
<line class="leader" x1="340" y1="452" x2="400" y2="452"/>
<line class="leader" x1="340" y1="548" x2="400" y2="548"/>
<g class="coral"><rect x="40" y="616" width="600" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="639" text-anchor="middle">Money map (built in Stage 3)</text><text class="ts" x="340" y="659" text-anchor="middle">platform margin = shop price − bank fee − fraud</text></g>
<g class="teal"><rect x="40" y="696" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts legend" x="60" y="706">raw table</text>
<g class="coral"><rect x="150" y="696" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts legend" x="170" y="706">calculated</text>
<g class="gray"><rect x="260" y="696" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts legend" x="280" y="706">who holds the money; arrows = money moving</text>
</svg>
