<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="785" viewBox="0 0 1140 785" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Profiling and cleaning</title><desc>Diagram of the profiling step: six hand-written analysis queries and the profile_table macro, what each profile shows, and the four findings with the action taken for each.</desc><style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2937; }
.h1 { font-size: 24px; font-weight: 700; }
.sub { font-size: 14px; fill: #6B7280; }
.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
.grain { font-size: 13px; font-weight: 600; }
.meta { font-size: 12px; fill: #6B7280; }
.col { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
.note { font-size: 11.5px; fill: #6B7280; }
.badge { font-size: 11px; font-weight: 600; }
.lbl { font-size: 12px; fill: #6B7280; }
.lblb { font-size: 12px; font-weight: 600; fill: #374151; }
.body { font-size: 13px; fill: #374151; }
.bodyb { font-size: 13px; font-weight: 600; }
.big { font-size: 22px; font-weight: 700; }
.sec { font-size: 11px; font-weight: 700; fill: #6B7280; letter-spacing: 0.06em; }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect width="1140" height="785" fill="#F8FAFC"/><text class="h1" x="40" y="52">Profiling and cleaning</text><text class="sub" x="40" y="78">Every raw table was profiled before its staging model was built, first by hand and then with a reusable macro.</text><rect x="30" y="112" width="300" height="191" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="46" y="140">What was profiled</text><text class="sec" x="46" y="168">RAW TABLES (BIGQUERY DATASET RAW)</text><text class="col" x="46" y="187">shops, banks, fee_rules,</text><text class="col" x="46" y="206">payment_attempts, bank_payouts,</text><text class="col" x="46" y="225">fraud_reports</text><text class="sec" x="46" y="247">STAGING VIEWS</text><text class="col" x="46" y="266">the same six tables as stg_*,</text><text class="col" x="46" y="285">after cleaning and renaming</text><rect x="410" y="112" width="330" height="136" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="426" y="140">1. By hand: six queries</text><rect x="656" y="125" width="70" height="20" rx="10" fill="#FCE7F3"/><text class="badge" x="691.0" y="139" text-anchor="middle" style="fill:#9D174D">analysis</text><text class="col" x="426" y="165">dbt/analyses/profile_&lt;table&gt;.sql</text><text class="body" x="426" y="192">One query per raw table, written for that</text><text class="body" x="426" y="211">table&#x27;s columns. The first look at the raw</text><text class="body" x="426" y="230">data, before any staging model was built.</text><rect x="410" y="268" width="330" height="174" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="426" y="296">2. With a macro: one call per table</text><rect x="677" y="281" width="49" height="20" rx="10" fill="#EDE9FE"/><text class="badge" x="701.5" y="295" text-anchor="middle" style="fill:#5B21B6">macro</text><text class="col" x="426" y="321">dbt/macros/profile_table.sql</text><text class="col" x="426" y="340">dbt/analyses/profile_all.sql</text><text class="body" x="426" y="367">The macro profiles any table. profile_all</text><text class="body" x="426" y="386">runs it on all six staging views: 45 rows,</text><text class="body" x="426" y="405">one per column. The results match the</text><text class="body" x="426" y="424">queries written by hand.</text><rect x="820" y="112" width="290" height="166" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="836" y="140">What each profile shows</text><text class="body" x="836" y="165">• row count</text><text class="body" x="836" y="184">• the key: unique and never empty?</text><text class="body" x="836" y="203">• empty values per column</text><text class="body" x="836" y="222">• distinct values and categories</text><text class="body" x="836" y="241">• minimum and maximum of numbers and</text><text class="body" x="836" y="260">dates</text><path d="M330,172 L410,172" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M330,202 L410,318" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M740,162 L820,162" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M740,318 L820,248" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><text class="sec" x="30" y="492">WHAT IT FOUND, AND WHAT WAS DONE</text><rect x="30.0" y="508" width="247.5" height="169" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="30.0" y="518" width="4" height="149" rx="2" fill="#DC2626"/><text class="bodyb" x="46.0" y="536">317 duplicate tries</text><text class="body" x="46.0" y="561">payment_attempts has 317 rows</text><text class="body" x="46.0" y="580">twice, as exact copies.</text><text class="sec" x="46.0" y="602">DONE</text><text class="body" x="46.0" y="621">Removed in stg_payment_attempts</text><text class="body" x="46.0" y="640">with SELECT DISTINCT * (106,130</text><text class="body" x="46.0" y="659">→ 105,813 rows).</text><rect x="307.5" y="508" width="247.5" height="207" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="307.5" y="518" width="4" height="187" rx="2" fill="#2563EB"/><text class="bodyb" x="323.5" y="536">Empty values with a meaning</text><text class="body" x="323.5" y="561">No retry date, no 3D Secure</text><text class="body" x="323.5" y="580">threshold, no fee rule end date,</text><text class="body" x="323.5" y="599">no decline type.</text><text class="sec" x="323.5" y="621">DONE</text><text class="body" x="323.5" y="640">Kept as they are. Rule tests</text><text class="body" x="323.5" y="659">check the decline type and</text><text class="body" x="323.5" y="678">threshold are empty only when</text><text class="body" x="323.5" y="697">they should be.</text><rect x="585.0" y="508" width="247.5" height="188" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="585.0" y="518" width="4" height="168" rx="2" fill="#EA580C"/><text class="bodyb" x="601.0" y="536">Late fraud reports</text><text class="body" x="601.0" y="561">Reports arrive weeks after the</text><text class="body" x="601.0" y="580">payment, so October–December</text><text class="body" x="601.0" y="599">fraud looks low.</text><text class="sec" x="601.0" y="621">DONE</text><text class="body" x="601.0" y="640">Fraud rates are measured on</text><text class="body" x="601.0" y="659">January–July payments when</text><text class="body" x="601.0" y="678">valuing the fixes.</text><rect x="862.5" y="508" width="247.5" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="862.5" y="518" width="4" height="130" rx="2" fill="#EA580C"/><text class="bodyb" x="878.5" y="536">Wrong fees, missing payouts</text><text class="body" x="878.5" y="561">Invisible row by row; they only</text><text class="body" x="878.5" y="580">show when payouts meet payments.</text><text class="sec" x="878.5" y="602">DONE</text><text class="body" x="878.5" y="621">Found by the payout check</text><text class="body" x="878.5" y="640">(fct_payout_checks).</text><text class="body" x="30" y="745">Everything else was clean: no empty text, no spelling variants, all amounts and dates in range.</text></svg>