<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="749" viewBox="0 0 1140 749" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How each fix is valued</title><desc>Diagram of how the four fixes are valued: repricing, bank choice, 3D Secure and retries, each with what is measured, how it is applied and the yearly result, plus the fraud range and the ranking.</desc><style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2937; }
.h1 { font-size: 24px; font-weight: 700; }
.sub { font-size: 14px; fill: #6B7280; }
.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
.grain { font-size: 13px; font-weight: 600; }
.meta { font-size: 12px; fill: #6B7280; }
.col { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
.note { font-size: 11.5px; fill: #6B7280; }
.badge { font-size: 11px; font-weight: 600; }
.lbl { font-size: 12px; fill: #6B7280; }
.lblb { font-size: 12px; font-weight: 600; fill: #374151; }
.body { font-size: 13px; fill: #374151; }
.bodyb { font-size: 13px; font-weight: 600; }
.big { font-size: 22px; font-weight: 700; }
.sec { font-size: 11px; font-weight: 700; fill: #6B7280; letter-spacing: 0.06em; }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect width="1140" height="749" fill="#F8FAFC"/><text class="h1" x="40" y="52">How each fix is valued</text><text class="sub" x="40" y="78">One simple method per fix: measure a rate on 2025, apply it to each shop, and report platform profit and shop sales.</text><rect x="30" y="108" width="1080" height="90" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="46" y="136">The rule for every fix</text><text class="body" x="46" y="161">Value = 2025 with this one change − 2025 as it happened, measured on groups of similar payments per business type. Each fix gets two yearly values:</text><text class="body" x="46" y="180">platform profit and shop sales. Fixes are never added together.</text><rect x="30.0" y="222" width="247.5" height="327" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="30.0" y="232" width="4" height="307" rx="2" fill="#2563EB"/><text class="big" x="46.0" y="250">Repricing</text><text class="sec" x="46.0" y="278">MEASURE</text><text class="body" x="46.0" y="297">Each shop&#x27;s yearly cost: bank</text><text class="body" x="46.0" y="316">fees + expected fraud (its</text><text class="body" x="46.0" y="335">type&#x27;s fraud rate × its sales</text><text class="body" x="46.0" y="354">without 3D Secure).</text><text class="sec" x="46.0" y="376">APPLY TO EACH SHOP</text><text class="body" x="46.0" y="395">Shops that lose money move to a</text><text class="body" x="46.0" y="414">safe %: the price that still</text><text class="body" x="46.0" y="433">breaks even at the high fraud</text><text class="body" x="46.0" y="452">value.</text><text class="sec" x="46.0" y="474">RESULT PER YEAR</text><text class="bodyb" x="46.0" y="493">4 shops move</text><text class="body" x="46.0" y="512">+€6,068 platform</text><text class="body" x="46.0" y="531">€0 shop sales</text><rect x="307.5" y="222" width="247.5" height="327" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="307.5" y="232" width="4" height="307" rx="2" fill="#16A34A"/><text class="big" x="323.5" y="250">Bank choice</text><text class="sec" x="323.5" y="278">MEASURE</text><text class="body" x="323.5" y="297">Approval rate of Dutch, German</text><text class="body" x="323.5" y="316">and French cards on their own</text><text class="body" x="323.5" y="335">country&#x27;s bank and on another</text><text class="body" x="323.5" y="354">bank, per type.</text><text class="sec" x="323.5" y="376">APPLY TO EACH SHOP</text><text class="body" x="323.5" y="395">Each shop&#x27;s € of such cards on</text><text class="body" x="323.5" y="414">another bank × the difference.</text><text class="body" x="323.5" y="433">The fee change comes from the</text><text class="body" x="323.5" y="452">fee rules.</text><text class="sec" x="323.5" y="474">RESULT PER YEAR</text><text class="bodyb" x="323.5" y="493">16 shops where it pays</text><text class="body" x="323.5" y="512">+€5,948 platform</text><text class="body" x="323.5" y="531">+€144,378 shop sales</text><rect x="585.0" y="222" width="247.5" height="308" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="585.0" y="232" width="4" height="288" rx="2" fill="#EA580C"/><text class="big" x="601.0" y="250">3D Secure</text><text class="sec" x="601.0" y="278">MEASURE</text><text class="body" x="601.0" y="297">Share of customers who give up</text><text class="body" x="601.0" y="316">at the check, and fraud cost per</text><text class="body" x="601.0" y="335">€100 of sales, per business</text><text class="body" x="601.0" y="354">type.</text><text class="sec" x="601.0" y="376">APPLY TO EACH SHOP</text><text class="body" x="601.0" y="395">Check every payment: fraud saved</text><text class="body" x="601.0" y="414">− margin lost on give-ups. Check</text><text class="body" x="601.0" y="433">no payment: the reverse.</text><text class="sec" x="601.0" y="455">RESULT PER YEAR</text><text class="bodyb" x="601.0" y="474">Every payment, best estimate:</text><text class="body" x="601.0" y="493">+€11,494 platform</text><text class="body" x="601.0" y="512">−€214,555 shop sales</text><rect x="862.5" y="222" width="247.5" height="308" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="862.5" y="232" width="4" height="288" rx="2" fill="#7C3AED"/><text class="big" x="878.5" y="250">Retries</text><text class="sec" x="878.5" y="278">MEASURE</text><text class="body" x="878.5" y="297">Share of &quot;try again&quot; declines</text><text class="body" x="878.5" y="316">that still end approved, with</text><text class="body" x="878.5" y="335">retries on and off, per business</text><text class="body" x="878.5" y="354">type.</text><text class="sec" x="878.5" y="376">APPLY TO EACH SHOP</text><text class="body" x="878.5" y="395">Each shop&#x27;s € of such declines ×</text><text class="body" x="878.5" y="414">the difference, then × its</text><text class="body" x="878.5" y="433">margin for platform profit.</text><text class="sec" x="878.5" y="455">RESULT PER YEAR</text><text class="bodyb" x="878.5" y="474">6 shops switch on</text><text class="body" x="878.5" y="493">+€248 platform</text><text class="body" x="878.5" y="512">+€44,639 shop sales</text><rect x="30" y="573" width="525.0" height="136" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="46" y="601">Fraud needs a range</text><text class="body" x="46" y="626">Reports arrive up to 26 weeks late, so fraud rates come from January–July</text><text class="body" x="46" y="645">payments, whose reports are complete, and apply to the whole year.</text><text class="body" x="46" y="672">Fraud is rare: k cases could easily have been k − 2√k to k + 2√k. That</text><text class="body" x="46" y="691">gives a low, best and high value for repricing and 3D Secure.</text><rect x="585.0" y="573" width="525.0" height="136" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="601.0" y="601">Ranking</text><text class="body" x="601.0" y="626">Ranked by the low estimate of platform profit, so the safest money comes</text><text class="body" x="601.0" y="645">first:</text><text class="body" x="601.0" y="672">1 repricing · 2 bank choice · 3 3D Secure on every payment · 4 retries ·</text><text class="body" x="601.0" y="691">5 3D Secure on no payment (loses money)</text></svg>