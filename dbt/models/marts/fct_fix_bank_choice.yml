models:
  - name: fct_fix_bank_choice
    columns:
      - name: shop_id
        data_tests:
          - unique
          - not_null
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_shop_margins')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "approval_rate_local > approval_rate_other AND shop_sales_gain_eur >= 0"