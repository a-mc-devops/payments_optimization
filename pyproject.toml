# Python environment for the whole repo (data generator + dbt), managed with uv.
# Set up or refresh it with: uv sync
# Exact versions of every package are recorded in uv.lock (committed).

[project]
name = "payments-optimization"
version = "0.1.0"
description = "Where a payments platform loses money and which fixes recover the most"
requires-python = "==3.12.*"
dependencies = [
    # dbt 1.12 (Python generation) and its BigQuery adapter
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12,<1.13",
    # Data generator: versions used for the committed answer-file fingerprint
    "numpy==2.2.6",
    "pandas==2.3.3",
]
