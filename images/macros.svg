<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="672" viewBox="0 0 1140 672" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Macros: reusable dbt code</title><desc>Diagram of the two dbt macros: profile_table, with its four steps and an example output row, and generate_schema_name, with the dataset names it produces in development and production.</desc><style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2937; }
.h1 { font-size: 24px; font-weight: 700; }
.sub { font-size: 14px; fill: #6B7280; }
.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
.grain { font-size: 13px; font-weight: 600; }
.meta { font-size: 12px; fill: #6B7280; }
.col { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
.note { font-size: 11.5px; fill: #6B7280; }
.badge { font-size: 11px; font-weight: 600; }
.lbl { font-size: 12px; fill: #6B7280; }
.lblb { font-size: 12px; font-weight: 600; fill: #374151; }
.body { font-size: 13px; fill: #374151; }
.bodyb { font-size: 13px; font-weight: 600; }
.big { font-size: 22px; font-weight: 700; }
.sec { font-size: 11px; font-weight: 700; fill: #6B7280; letter-spacing: 0.06em; }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect width="1140" height="672" fill="#F8FAFC"/><text class="h1" x="40" y="52">Macros: reusable dbt code</text><text class="sub" x="40" y="78">Two macros: one profiles any table, the other names the BigQuery datasets the models are built in.</text><rect x="30" y="112" width="525" height="520" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="name" x="46" y="142">profile_table(relation)</text><rect x="492" y="127" width="49" height="20" rx="10" fill="#EDE9FE"/><text class="badge" x="516.5" y="141" text-anchor="middle" style="fill:#5B21B6">macro</text><text class="grain" x="46" y="166">Profiles any table: one row per column.</text><text class="meta" x="46" y="184">dbt/macros/profile_table.sql</text><circle cx="60" cy="212" r="12" fill="#EDE9FE"/><text class="badge" x="60" y="216" text-anchor="middle" style="fill:#5B21B6">1</text><text class="bodyb" x="84" y="217">Take any table</text><text class="meta" x="84" y="236">ref(&#x27;stg_shops&#x27;) or source(&#x27;raw&#x27;, &#x27;shops&#x27;)</text><circle cx="60" cy="274" r="12" fill="#EDE9FE"/><text class="badge" x="60" y="278" text-anchor="middle" style="fill:#5B21B6">2</text><text class="bodyb" x="84" y="279">List its columns</text><text class="meta" x="84" y="298">adapter.get_columns_in_relation(relation)</text><circle cx="60" cy="336" r="12" fill="#EDE9FE"/><text class="badge" x="60" y="340" text-anchor="middle" style="fill:#5B21B6">3</text><text class="bodyb" x="84" y="341">Write one SELECT per column</text><text class="meta" x="84" y="360">rows, empty values, distinct values; min and max for numbers</text><text class="meta" x="84" y="377">and dates</text><circle cx="60" cy="398" r="12" fill="#EDE9FE"/><text class="badge" x="60" y="402" text-anchor="middle" style="fill:#5B21B6">4</text><text class="bodyb" x="84" y="403">Stack them</text><text class="meta" x="84" y="422">UNION ALL between the SELECTs (min and max cast to text so all</text><text class="meta" x="84" y="439">rows fit)</text><text class="sec" x="46" y="464">EXAMPLE OUTPUT (ONE ROW OF stg_shops)</text><rect x="40" y="476" width="505" height="58" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/><text class="meta" x="46" y="498">column_name</text><text class="col" x="46" y="522">shop_fee_pct</text><text class="meta" x="160" y="498">data_type</text><text class="col" x="160" y="522">NUMERIC</text><text class="meta" x="245" y="498">rows</text><text class="col" x="245" y="522">24</text><text class="meta" x="295" y="498">empty</text><text class="col" x="295" y="522">0</text><text class="meta" x="355" y="498">distinct</text><text class="col" x="355" y="522">7</text><text class="meta" x="425" y="498">min</text><text class="col" x="425" y="522">0.9</text><text class="meta" x="480" y="498">max</text><text class="col" x="480" y="522">2.4</text><text class="meta" x="46" y="552">Full output columns: table_name, column_name, data_type, row_count,</text><text class="meta" x="46" y="569">empty_values, distinct_values, min_value, max_value.</text><text class="body" x="46" y="598">Called in dbt/analyses/profile_all.sql for all six staging</text><text class="body" x="46" y="617">views: 45 rows in one result.</text><rect x="585" y="112" width="525" height="520" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="name" x="601" y="142">generate_schema_name</text><rect x="1047" y="127" width="49" height="20" rx="10" fill="#EDE9FE"/><text class="badge" x="1071.5" y="141" text-anchor="middle" style="fill:#5B21B6">macro</text><text class="grain" x="601" y="166">Decides which BigQuery dataset each model is built in.</text><text class="meta" x="601" y="184">dbt/macros/generate_schema_name.sql (overrides dbt&#x27;s default)</text><text class="sec" x="601" y="224">LAYER</text><text class="sec" x="715" y="224">DEVELOPMENT</text><text class="sec" x="965" y="224">PRODUCTION</text><text class="col" x="601" y="258">staging</text><text class="col" x="715" y="258">dbt_amcdevops_staging</text><text class="col" x="965" y="258">staging</text><path d="M601,270 L1094,270" stroke="#9CA3AF" stroke-width="1.5" fill="none"/><text class="col" x="601" y="292">intermediate</text><text class="col" x="715" y="292">dbt_amcdevops_intermediate</text><text class="col" x="965" y="292">intermediate</text><path d="M601,304 L1094,304" stroke="#9CA3AF" stroke-width="1.5" fill="none"/><text class="col" x="601" y="326">marts</text><text class="col" x="715" y="326">dbt_amcdevops_marts</text><text class="col" x="965" y="326">marts</text><path d="M601,338 L1094,338" stroke="#9CA3AF" stroke-width="1.5" fill="none"/><text class="body" x="601" y="384">The layer is set per folder in dbt_project.yml. dbt&#x27;s default</text><text class="body" x="601" y="404">always glues the target dataset and the layer together.</text><text class="body" x="601" y="424">That suits development: each developer works in their own</text><text class="body" x="601" y="444">datasets and can&#x27;t overwrite anyone else&#x27;s tables.</text><text class="body" x="601" y="464"></text><text class="body" x="601" y="484">In production the macro drops the prefix, so the shared</text><text class="body" x="601" y="504">tables get clean names: staging, intermediate, marts.</text><text class="body" x="601" y="524"></text><text class="body" x="601" y="544">Models without a layer go to the target dataset itself.</text></svg>