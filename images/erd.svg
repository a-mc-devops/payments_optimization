<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
<title>Entity relationship diagram of the six raw tables</title>
<desc>payment_attempts sits in the middle. shops and banks each link to many attempts and many payouts; banks link to many fee rules; each attempt has zero or one fraud report. Payouts and fee rules match attempts by rule rather than by an ID.</desc>
<defs><style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #085041; }
.ts { font-size: 12px; fill: #0F6E56; }
.lbl { font-size: 12px; fill: #5F5E5A; }
.tbl { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.ln { stroke: #888780; stroke-width: 1; }
.dash { stroke: #888780; stroke-width: 1; stroke-dasharray: 4 3; }
</style></defs>
<rect x="0" y="0" width="680" height="560" fill="#FFFFFF"/>
<rect class="tbl" x="40" y="40" width="170" height="148" rx="4"/><text class="th" x="52" y="62">shops</text><text class="ts" x="52" y="80">24 rows · 1 per shop</text><text class="ts" x="52" y="102">PK shop_id</text><text class="ts" x="52" y="120">country, business_type</text><text class="ts" x="52" y="138">fee_pct, fixed_fee_eur</text><text class="ts" x="52" y="156">retries_on_date</text><text class="ts" x="52" y="174">three_ds_policy, threshold</text>
<rect class="tbl" x="255" y="40" width="170" height="202" rx="4"/><text class="th" x="267" y="62">payment_attempts</text><text class="ts" x="267" y="80">105,813 rows · 1 per try</text><text class="ts" x="267" y="102">PK attempt_id (after dedup)</text><text class="ts" x="267" y="120">payment_id: groups retries</text><text class="ts" x="267" y="138">FK shop_id → shops</text><text class="ts" x="267" y="156">FK bank_id → banks</text><text class="ts" x="267" y="174">attempted_at, amount_eur</text><text class="ts" x="267" y="192">card_country, card_type</text><text class="ts" x="267" y="210">three_ds_used</text><text class="ts" x="267" y="228">outcome, decline_type</text>
<rect class="tbl" x="470" y="40" width="170" height="112" rx="4"/><text class="th" x="482" y="62">fraud_reports</text><text class="ts" x="482" y="80">162 rows · 1 per report</text><text class="ts" x="482" y="102">PK fraud_report_id</text><text class="ts" x="482" y="120">FK attempt_id → attempts</text><text class="ts" x="482" y="138">reported_date, amount_eur</text>
<rect class="tbl" x="40" y="330" width="170" height="148" rx="4"/><text class="th" x="52" y="352">bank_payouts</text><text class="ts" x="52" y="370">11,281 · shop × bank × day</text><text class="ts" x="52" y="392">PK payout_id</text><text class="ts" x="52" y="410">FK shop_id, FK bank_id</text><text class="ts" x="52" y="428">payment_date, payout_date</text><text class="ts" x="52" y="446">payment_count</text><text class="ts" x="52" y="464">gross, fees, net (€)</text>
<rect class="tbl" x="255" y="330" width="170" height="94" rx="4"/><text class="th" x="267" y="352">banks</text><text class="ts" x="267" y="370">3 rows · 1 per bank</text><text class="ts" x="267" y="392">PK bank_id</text><text class="ts" x="267" y="410">bank_name, country</text>
<rect class="tbl" x="470" y="330" width="170" height="148" rx="4"/><text class="th" x="482" y="352">fee_rules</text><text class="ts" x="482" y="370">21 rows · 1 per fee rule</text><text class="ts" x="482" y="392">PK bank_id + card_type</text><text class="ts" x="482" y="410">  + region + valid_from</text><text class="ts" x="482" y="428">FK bank_id → banks</text><text class="ts" x="482" y="446">fee_pct, fixed_fee_eur</text><text class="ts" x="482" y="464">valid_to (empty = current)</text>
<line class="ln" x1="210" y1="114" x2="255" y2="114"/><text class="lbl" x="232" y="106" text-anchor="middle">1 : n</text>
<line class="ln" x1="425" y1="96" x2="470" y2="96"/><text class="lbl" x="447" y="88" text-anchor="middle">1 : 0–1</text>
<line class="ln" x1="125" y1="188" x2="125" y2="330"/><text class="lbl" x="133" y="264">1 : n</text>
<line class="ln" x1="340" y1="242" x2="340" y2="330"/><text class="lbl" x="348" y="290">n : 1</text>
<line class="ln" x1="210" y1="377" x2="255" y2="377"/><text class="lbl" x="232" y="369" text-anchor="middle">n : 1</text>
<line class="ln" x1="425" y1="377" x2="470" y2="377"/><text class="lbl" x="447" y="369" text-anchor="middle">1 : n</text>
<line class="dash" x1="275" y1="242" x2="195" y2="330"/>
<line class="dash" x1="405" y1="242" x2="485" y2="330"/>
<text class="lbl" x="40" y="508">PK = identifies a row · FK → = points to another table's PK · 1 : n = one to many</text>
<text class="lbl" x="40" y="528">solid line = linked by an ID · dashed line = matched by a rule, not an ID (see data_model.md)</text>
</svg>
