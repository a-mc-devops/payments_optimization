<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="648" viewBox="0 0 1140 648" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Checked against the hidden answers</title><desc>Diagram of the answer check: the answer file sealed by its fingerprint before analysis, opened once at the end, and what the comparison found exactly, closely, and where it was off.</desc><style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2937; }
.h1 { font-size: 24px; font-weight: 700; }
.sub { font-size: 14px; fill: #6B7280; }
.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
.grain { font-size: 13px; font-weight: 600; }
.meta { font-size: 12px; fill: #6B7280; }
.col { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
.note { font-size: 11.5px; fill: #6B7280; }
.badge { font-size: 11px; font-weight: 600; }
.lbl { font-size: 12px; fill: #6B7280; }
.lblb { font-size: 12px; font-weight: 600; fill: #374151; }
.body { font-size: 13px; fill: #374151; }
.bodyb { font-size: 13px; font-weight: 600; }
.big { font-size: 22px; font-weight: 700; }
.sec { font-size: 11px; font-weight: 700; fill: #6B7280; letter-spacing: 0.06em; }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect width="1140" height="648" fill="#F8FAFC"/><text class="h1" x="40" y="52">Checked against the hidden answers</text><text class="sub" x="40" y="78">The data is simulated, so the true answers exist. They were sealed before the analysis and opened once at the end.</text><path d="M360.6666666666667,148 L402.6666666666667,148" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M737.3333333333334,148 L779.3333333333334,148" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect x="30.0" y="108" width="326.6666666666667" height="109" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="46.0" y="136">1. Before any analysis</text><text class="body" x="46.0" y="161">The generator writes the true answers to a</text><text class="body" x="46.0" y="180">hidden file. Only its SHA-256 fingerprint is</text><text class="body" x="46.0" y="199">committed to git.</text><rect x="406.6666666666667" y="108" width="326.6666666666667" height="90" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="422.6666666666667" y="136">2. While building</text><text class="body" x="422.6666666666667" y="161">Every model, test and the dashboard are built</text><text class="body" x="422.6666666666667" y="180">without opening the file. Nothing reads it.</text><rect x="783.3333333333334" y="108" width="326.6666666666667" height="109" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="799.3333333333334" y="136">3. At the end, once</text><text class="body" x="799.3333333333334" y="161">The file&#x27;s fingerprint still matches. The</text><text class="body" x="799.3333333333334" y="180">results are compared with it once, and no model</text><text class="body" x="799.3333333333334" y="199">is changed afterwards.</text><text class="sec" x="30" y="257">WHAT THE COMPARISON SHOWED</text><rect x="30.0" y="271" width="340.0" height="109" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="30.0" y="281" width="4" height="89" rx="2" fill="#16A34A"/><text class="bodyb" x="46.0" y="299">Found exactly</text><text class="body" x="46.0" y="324">• The same 317 duplicate tries</text><text class="body" x="46.0" y="343">• The same 4 missing payouts</text><text class="body" x="46.0" y="362">• The same 4 loss-making shops</text><rect x="400.0" y="271" width="340.0" height="223" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="400.0" y="281" width="4" height="203" rx="2" fill="#2563EB"/><text class="bodyb" x="416.0" y="299">Close to the truth</text><text class="body" x="416.0" y="324">• 96 of 99 wrong fees; the 3 missed were 2–5</text><text class="body" x="416.0" y="343">cents, inside the rounding allowance</text><text class="body" x="416.0" y="362">• Fraud cost for the year: 2.6% low (reported</text><text class="body" x="416.0" y="381">fraud alone: 9.7% low)</text><text class="body" x="416.0" y="400">• Platform margin: 0.8% off</text><text class="body" x="416.0" y="419">• 3D Secure on every payment: true gain</text><text class="body" x="416.0" y="438">€14,443, inside the range</text><text class="body" x="416.0" y="457">• Give-up and rescue rates within 0.3</text><text class="body" x="416.0" y="476">percentage points</text><rect x="770.0" y="271" width="340.0" height="147" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="770.0" y="281" width="4" height="127" rx="2" fill="#DC2626"/><text class="bodyb" x="786.0" y="299">Off</text><text class="body" x="786.0" y="324">• Retries: shop sales 18% too low</text><text class="body" x="786.0" y="343">• 3D Secure on no payment: shop sales 25% too</text><text class="body" x="786.0" y="362">high (the bank would decline some)</text><text class="body" x="786.0" y="381">• Fraud per shop: 6 of 16 shop margins outside</text><text class="body" x="786.0" y="400">their range (S14 most)</text><rect x="30" y="518" width="1080" height="90" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="46" y="546">What it means</text><text class="body" x="46" y="571">The data checks found every type of planted problem, and the platform-level numbers are close. Fraud per shop is the weak point. Ranking by the low</text><text class="body" x="46" y="590">estimate was cautious: with the true values, 3D Secure on every payment is worth more to the platform than repricing.</text></svg>