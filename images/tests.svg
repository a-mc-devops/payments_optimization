<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="678" viewBox="0 0 1140 678" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Tests: what can go wrong, and the test that catches it</title><desc>Diagram of the 135 dbt tests by layer (staging 69, core 22, fix 36, payout checks 8), what each layer&#x27;s tests prove, and the three kinds of tests used.</desc><style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2937; }
.h1 { font-size: 24px; font-weight: 700; }
.sub { font-size: 14px; fill: #6B7280; }
.name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
.grain { font-size: 13px; font-weight: 600; }
.meta { font-size: 12px; fill: #6B7280; }
.col { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
.note { font-size: 11.5px; fill: #6B7280; }
.badge { font-size: 11px; font-weight: 600; }
.lbl { font-size: 12px; fill: #6B7280; }
.lblb { font-size: 12px; font-weight: 600; fill: #374151; }
.body { font-size: 13px; fill: #374151; }
.bodyb { font-size: 13px; font-weight: 600; }
.big { font-size: 22px; font-weight: 700; }
.sec { font-size: 11px; font-weight: 700; fill: #6B7280; letter-spacing: 0.06em; }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect width="1140" height="678" fill="#F8FAFC"/><text class="h1" x="40" y="52">Tests: what can go wrong, and the test that catches it</text><text class="sub" x="40" y="78">Each layer is tested for the mistakes it could make. A failing test stops the build.</text><path d="M279.5,172 L305.5,172" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M557.0,172 L583.0,172" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M834.5,172 L860.5,172" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><text class="sec" x="30" y="126">TESTS PER LAYER: 135 IN TOTAL, RUN ON EVERY dbt build</text><rect x="30.0" y="148" width="247.5" height="280" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="30.0" y="158" width="4" height="260" rx="2" fill="#166534"/><text class="big" x="46.0" y="176">Staging</text><text class="body" x="46.0" y="201">• Keys unique and never empty</text><text class="body" x="46.0" y="220">• IDs exist in the table they</text><text class="body" x="46.0" y="239">point to</text><text class="body" x="46.0" y="258">• Only allowed values (card types,</text><text class="body" x="46.0" y="277">outcomes, …)</text><text class="body" x="46.0" y="296">• Rules between columns: fee rules</text><text class="body" x="46.0" y="315">unique on 4 columns; one payout</text><text class="body" x="46.0" y="334">per shop × bank × day; net = gross</text><text class="body" x="46.0" y="353">− fees; decline type filled only</text><text class="body" x="46.0" y="372">when declined</text><text class="body" x="46.0" y="391">• Every fraud report points to an</text><text class="body" x="46.0" y="410">approved try</text><text class="big" x="261.5" y="177" text-anchor="end" style="fill:#166534">69</text><rect x="307.5" y="148" width="247.5" height="185" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="307.5" y="158" width="4" height="165" rx="2" fill="#2563EB"/><text class="big" x="323.5" y="176">Core models</text><text class="body" x="323.5" y="201">• No join doubles or drops a row</text><text class="body" x="323.5" y="220">• Every sale matches exactly one</text><text class="body" x="323.5" y="239">fee rule</text><text class="body" x="323.5" y="258">• The approved try is always a</text><text class="body" x="323.5" y="277">payment&#x27;s last</text><text class="body" x="323.5" y="296">• Money map totals = its inputs,</text><text class="body" x="323.5" y="315">to the cent</text><text class="big" x="539.0" y="177" text-anchor="end" style="fill:#2563EB">22</text><rect x="585.0" y="148" width="247.5" height="242" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="585.0" y="158" width="4" height="222" rx="2" fill="#EA580C"/><text class="big" x="601.0" y="176">Fix models</text><text class="body" x="601.0" y="201">• One row per shop or business</text><text class="body" x="601.0" y="220">type</text><text class="body" x="601.0" y="239">• No shop lost in a join</text><text class="body" x="601.0" y="258">• low ≤ best ≤ high everywhere</text><text class="body" x="601.0" y="277">• No sign errors: checking every</text><text class="body" x="601.0" y="296">payment never adds sales; retries</text><text class="body" x="601.0" y="315">and the own-country bank approve</text><text class="body" x="601.0" y="334">more</text><text class="body" x="601.0" y="353">• Repriced shops break even at</text><text class="body" x="601.0" y="372">high fraud</text><text class="big" x="816.5" y="177" text-anchor="end" style="fill:#EA580C">36</text><rect x="862.5" y="148" width="247.5" height="147" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><rect x="862.5" y="158" width="4" height="127" rx="2" fill="#7C3AED"/><text class="big" x="878.5" y="176">Payout checks</text><text class="body" x="878.5" y="201">• One row per shop × bank × day</text><text class="body" x="878.5" y="220">• Every row has a valid result</text><text class="body" x="878.5" y="239">• Every payout and every sale</text><text class="body" x="878.5" y="258">lands in the table exactly once,</text><text class="body" x="878.5" y="277">so nothing slips off the list</text><text class="big" x="1094.0" y="177" text-anchor="end" style="fill:#7C3AED">8</text><text class="sec" x="30" y="462">HOW THE TESTS ARE WRITTEN</text><rect x="30.0" y="476" width="340.0" height="128" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="46.0" y="504">Built into dbt</text><text class="col" x="46.0" y="529">unique</text><text class="col" x="46.0" y="548">not_null</text><text class="col" x="46.0" y="567">accepted_values</text><text class="col" x="46.0" y="586">relationships</text><rect x="400.0" y="476" width="340.0" height="109" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="416.0" y="504">dbt_utils package</text><text class="col" x="416.0" y="529">unique_combination_of_columns</text><text class="col" x="416.0" y="548">expression_is_true</text><text class="col" x="416.0" y="567">equal_rowcount</text><rect x="770.0" y="476" width="340.0" height="109" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/><text class="bodyb" x="786.0" y="504">Custom SQL (dbt/tests/)</text><text class="col" x="786.0" y="529">assert_fraud_reports_on_approved_attempts</text><text class="col" x="786.0" y="548">assert_money_map_totals_match</text><text class="col" x="786.0" y="567">assert_payout_checks_cover_all_inputs</text><text class="body" x="30" y="638">From the core models on, every test was made to fail once on purpose, then fixed back, to prove it can catch the problem.</text></svg>