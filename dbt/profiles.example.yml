# Template for dbt's login settings. The real file lives OUTSIDE the repo:
#   mkdir -p ~/.dbt && cp -i profiles.example.yml ~/.dbt/profiles.yml
# Login method: your Google login (run once: gcloud auth application-default login).
# No passwords or key files here or anywhere in the repo.

payments_optimization:          # must match "profile:" in dbt_project.yml
  target: dev                   # used when you don't pass --target
  outputs:
    dev:                        # your working copy
      type: bigquery
      method: oauth             # use the gcloud login on this computer
      project: payments-optimization
      dataset: dbt_amcdevops          # prefix of the dev datasets: dbt_amcdevops_staging, ...
      location: EU              # must match the raw dataset
      threads: 4                # models built at the same time
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
    prod:                       # the finished models Power BI reads
      type: bigquery
      method: oauth
      project: payments-optimization
      dataset: analytics        # only used by models without a layer; layers get staging, intermediate, marts
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
